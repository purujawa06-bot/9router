name: Release

# THE only release workflow — MANUAL ONLY (Actions > Release > Run workflow).
# One run does everything in order:
#   1. read version from cli/package.json (v<version>)
#   2. AI-written bilingual (English + Indonesian) release notes from the
#      commits since the previous tag
#   3. create + push the tag and the GitHub Release
#   4. publish `@rikipurpur/9router` to npm
#   5. build + push the multi-arch Docker image to GHCR
# No tag-push trigger, no version detection: package.json is the source of
# truth and must already contain the new version (both package.json files
# must be in sync).

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as pre-release (skips npm + Docker latest tag)"
        type: boolean
        default: false
      overwrite_tag:
        description: "Delete and recreate the tag if v<version> already exists"
        type: boolean
        default: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: write
  packages: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags for the changelog range
          fetch-tags: true

      - name: Read version from package.json
        id: version
        run: |
          VER="$(node -p "require('./cli/package.json').version")"
          if [ -z "$VER" ] || [ "$VER" = "undefined" ]; then
            echo "::error::Could not read version from cli/package.json"
            exit 1
          fi
          TAG="v$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Check tag does not exist (unless overwrite)
        env:
          OVERWRITE: ${{ inputs.overwrite_tag }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [ "$OVERWRITE" = "true" ]; then
              echo "Tag $TAG exists — overwrite requested, deleting local + remote tag"
              git tag -d "$TAG" || true
              git push origin ":refs/tags/$TAG" || true
            else
              echo "::error::Tag $TAG already exists. Bump the version in package.json + cli/package.json first, or re-run with overwrite_tag enabled."
              exit 1
            fi
          fi

      - name: Collect changes since previous tag
        run: |
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          if [ -n "$PREV" ]; then
            echo "Previous tag: $PREV"
            RANGE="$PREV..HEAD"
          else
            echo "No previous tag — using recent history"
            RANGE="HEAD"
          fi
          echo "prev=$PREV" >> "$GITHUB_ENV"
          git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges | head -100 > /tmp/commits.txt
          echo "--- commits to summarise ---"
          cat /tmp/commits.txt

      - name: Generate bilingual release notes with AI
        run: |
          node <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const version = '${{ steps.version.outputs.version }}';
          const prev = process.env.prev || '';
          const commits = fs.readFileSync('/tmp/commits.txt', 'utf8').trim() || '(no new commits)';

          const prompt =
          `Write professional GitHub release notes for version ${version} ` +
          (prev ? `(changes since ${prev}) ` : ``) +
          `based ONLY on these commits (do not invent anything):\n\n${commits}\n\n` +
          `Rules:\n` +
          `- Output in TWO languages: English FIRST, then Bahasa Indonesia.\n` +
          `- Start with "## What's New (English)", then the English notes grouped ` +
          `under "### Features", "### Fixes", "### Other" (only non-empty groups).\n` +
          `- Then a line with exactly "---"\n` +
          `- Then "## Yang Baru (Bahasa Indonesia)" with the same structure translated.\n` +
          `- Keep each bullet to one line, concise, no emojis, no code blocks.`;

          const payload = JSON.stringify({
            model: 'auto',
            stream: false,
            messages: [
              { role: 'system', content: 'You write concise, professional software release notes.' },
              { role: 'user', content: prompt },
            ],
          });
          fs.writeFileSync('/tmp/ai-payload.json', payload);

          let body = '';
          try {
            const out = execSync(
              'curl -sS --max-time 120 -X POST "https://puruboy-api.vercel.app/api/chat/completions" ' +
              '-H "Content-Type: application/json" -d @/tmp/ai-payload.json',
              { encoding: 'utf8', maxBuffer: 4 * 1024 * 1024 },
            );
            const res = JSON.parse(out);
            body = res?.choices?.[0]?.message?.content
              || res?.choices?.[0]?.text
              || (typeof res === 'string' ? res : '');
            body = String(body).trim();
          } catch (e) {
            console.error('AI request failed, using fallback:', e.message);
          }

          if (!body) {
            body =
              `## What's New (English)\n\n${commits}\n\n---\n\n` +
              `## Yang Baru (Bahasa Indonesia)\n\n${commits}\n`;
          }
          fs.writeFileSync('/tmp/release-body.md', body + '\n');
          console.log('--- release notes preview (first 20 lines) ---');
          console.log(body.split('\n').slice(0, 20).join('\n'));
          EOF

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          ARGS=(--title "$TAG" --notes-file /tmp/release-body.md)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "${ARGS[@]}"

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install root deps (no lockfile in repo — use install, not ci)
        run: npm install --no-audit --no-fund

      - name: Install CLI build deps
        run: npm install --prefix cli --no-audit --no-fund

      - name: Build CLI module
        run: npm run --prefix cli build
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:20128

      - name: Pack CLI module
        # NOTE: `npm pack` ignores --prefix and packs the cwd, so run it
        # from inside cli/ — otherwise it packs the root 9router-app tree.
        working-directory: cli
        run: |
          mkdir -p /tmp/dist
          npm pack --pack-destination /tmp/dist
          ls -la /tmp/dist

      - name: Verify packed module
        run: |
          rm -rf /tmp/rel && mkdir -p /tmp/rel
          ls -la /tmp/dist
          # Guard: refuse a root-package tarball (9router-app-*) — only the
          # CLI module (rikipurpur-9router-X.Y.Z.tgz) may be published.
          if ls /tmp/dist/9router-app-*.tgz >/dev/null 2>&1; then
            echo "::error::Wrong tarball packed (root 9router-app instead of CLI module)"
            exit 1
          fi
          tar -xzf /tmp/dist/rikipurpur-9router-[0-9]*.tgz -C /tmp/rel --strip-components=1
          # Sanity: refuse to publish a broken module
          test -f /tmp/rel/cli.js
          test -f /tmp/rel/package.json
          ls /tmp/rel/app
          test -f /tmp/rel/app/custom-server.js || test -f /tmp/rel/app/server.js
          node -p "const p=require('/tmp/rel/package.json'); if(p.name!=='@rikipurpur/9router'||!p.bin?.['9router']) throw new Error('bad package'); p.version"

      - name: Publish to npm
        # Pre-releases are published to Docker only, never to the npm latest channel.
        if: ${{ inputs.prerelease != true }}
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ls -la /tmp/dist
          npm publish /tmp/dist/rikipurpur-9router-*.tgz --provenance --access public

  # NOTE: linux/arm64 builds natively on an ARM runner. The previous single-job
  # QEMU-emulated arm64 build took hours (npm install + next build under
  # emulation are 5-20x slower and regularly looked "stuck"). Each arch builds
  # natively, pushes by digest, then the merge job assembles the manifest list.

  docker-build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels only — tags are applied at merge)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: |
            type=gha,mode=max
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest,enable=${{ inputs.prerelease != true }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
