name: Publish Release (npm + Docker)

# Runs ONLY when a GitHub Release is published — which happens exclusively
# via the manual "Create Release Tag" workflow (Actions > Create Release Tag
# > Run workflow). There is no tag-push trigger and no version detection:
# the version comes from package.json, and must match the release tag.

on:
  release:
    types: [published]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write # npm provenance

jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify package.json version matches release tag
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="$(node -p "require('./cli/package.json').version")"
          echo "release tag: $TAG / cli/package.json: $VER"
          if [ "v$VER" != "$TAG" ]; then
            echo "::error::Version mismatch: release tag is $TAG but cli/package.json is $VER"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install root deps (no lockfile in repo — use install, not ci)
        run: npm install --no-audit --no-fund

      - name: Install CLI build deps
        run: npm install --prefix cli --no-audit --no-fund

      - name: Build CLI module
        run: npm run --prefix cli build
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:20128

      - name: Pack CLI module
        # NOTE: `npm pack` ignores --prefix and packs the cwd, so run it
        # from inside cli/ — otherwise it packs the root 9router-app tree.
        working-directory: cli
        run: |
          mkdir -p /tmp/dist
          npm pack --pack-destination /tmp/dist
          ls -la /tmp/dist

      - name: Verify packed module
        run: |
          rm -rf /tmp/rel && mkdir -p /tmp/rel
          ls -la /tmp/dist
          # Guard: refuse a root-package tarball (9router-app-*) — only the
          # CLI module (rikipurpur-9router-X.Y.Z.tgz) may be published.
          if ls /tmp/dist/9router-app-*.tgz >/dev/null 2>&1; then
            echo "::error::Wrong tarball packed (root 9router-app instead of CLI module)"
            exit 1
          fi
          tar -xzf /tmp/dist/rikipurpur-9router-[0-9]*.tgz -C /tmp/rel --strip-components=1
          # Sanity: refuse to publish a broken module
          test -f /tmp/rel/cli.js
          test -f /tmp/rel/package.json
          ls /tmp/rel/app
          test -f /tmp/rel/app/custom-server.js || test -f /tmp/rel/app/server.js
          node -p "const p=require('/tmp/rel/package.json'); if(p.name!=='@rikipurpur/9router'||!p.bin?.['9router']) throw new Error('bad package'); p.version"

      - name: Publish to npm
        # Pre-releases are published to Docker only, never to the npm latest channel.
        if: ${{ !github.event.release.prerelease }}
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ls -la /tmp/dist
          npm publish /tmp/dist/rikipurpur-9router-*.tgz --provenance --access public

  # NOTE: linux/arm64 builds natively on an ARM runner. The previous single-job
  # QEMU-emulated arm64 build took hours (npm install + next build under
  # emulation are 5-20x slower and regularly looked "stuck"). Each arch builds
  # natively, pushes by digest, then the merge job assembles the manifest list.

  docker-build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels only — tags are applied at merge)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: |
            type=gha,mode=max
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
