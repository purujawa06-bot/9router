name: Build release branch

# On every version tag (v*), build the installable CLI module and publish it
# to the `release` branch, so users can install without any build tools:
#
#   npm i -g github:purujawa06-bot/9router#release
#
# Installing the source tree directly does NOT work: the root package
# (9router-app) has no bin and ships the full dev tree, which breaks
# extraction on Windows (TAR_ENTRY_ERROR on next/dist). The `release`
# branch contains exactly the packed `9router` CLI module (cli.js + bin,
# hooks, src, prebuilt app/) — the same content as the npm tarball.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root deps (no lockfile in repo — use install, not ci)
        run: npm install --no-audit --no-fund

      - name: Install CLI build deps
        run: npm install --prefix cli --no-audit --no-fund

      - name: Sync version from tag
        # Tags are the single source of truth — no manual package.json bump
        # needed. MUST run before the build so the module is stamped with
        # the tag version.
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER="${REF#v}"
            echo "Syncing package versions to $VER (from tag $REF)"
            VER="$VER" node -e "
              const fs = require('fs');
              for (const f of ['package.json', 'cli/package.json']) {
                const p = JSON.parse(fs.readFileSync(f, 'utf8'));
                p.version = process.env.VER;
                fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
              }
            "
          else
            echo "Not a version tag ($REF) — keeping package.json versions"
          fi

      - name: Build CLI module
        run: npm run --prefix cli build
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:20128

      - name: Pack CLI module
        # NOTE: `npm pack` ignores --prefix and packs the cwd, so run it
        # from inside cli/ — otherwise it packs the root 9router-app tree.
        working-directory: cli
        run: |
          npm pack --pack-destination /tmp/dist
          ls -la /tmp/dist

      - name: Publish to release branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          rm -rf /tmp/rel && mkdir -p /tmp/rel
          echo "--- tarballs ---"
          ls -la /tmp/dist
          # Guard: refuse a root-package tarball (9router-app-*) — only the
          # CLI module (9router-X.Y.Z.tgz) may be published.
          if ls /tmp/dist/9router-app-*.tgz >/dev/null 2>&1; then
            echo "::error::Wrong tarball packed (root 9router-app instead of CLI module)"
            exit 1
          fi
          echo "--- extract ---"
          tar -xzf /tmp/dist/9router-[0-9]*.tgz -C /tmp/rel --strip-components=1
          echo "--- extracted tree (top 2 levels) ---"
          ls -la /tmp/rel
          # Sanity: refuse to publish a broken module
          test -f /tmp/rel/cli.js
          test -f /tmp/rel/package.json
          ls /tmp/rel/app
          test -f /tmp/rel/app/custom-server.js || test -f /tmp/rel/app/server.js
          node -p "const p=require('/tmp/rel/package.json'); if(p.name!=='9router'||!p.bin?.['9router']) throw new Error('bad package'); p.version"
          cp CHANGELOG.md /tmp/rel/CHANGELOG.md
          cd /tmp/rel
          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release ${{ github.ref_name }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin release
