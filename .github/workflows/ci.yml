name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # ponytail: single job (not split lint/test/build), split if queue time matters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root deps (no lockfile in repo — use install, not ci)
        # ponytail: single invocation + legacy-peer-deps (npm arborist edgesOut bug on vitest peer tree); vitest rides along via --no-save
        run: npm install --legacy-peer-deps --no-audit --no-fund vitest@4 --no-save

      - name: Lint (non-blocking — upstream has pre-existing errors)
        continue-on-error: true
        run: npx eslint .

      - name: Unit tests (skip real-provider tests — need API keys/network)
        working-directory: tests
        run: ../node_modules/.bin/vitest run --exclude '**/*.real.test.js' --exclude '**/real/**' --exclude '**/*.e2e.test.js'

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:20128
