name: Publish to npm

# On every version tag (v*), build the installable CLI module and publish it
# to npm as `@rikipurpur/9router`, so users can install without any
# build tools:
#
#   npm i -g @rikipurpur/9router
#
# NOTE: the npm name is scoped because unscoped `9router` is owned by
# upstream (decolua). The tarball of a scoped package is
# `<scope>-<name>-<version>.tgz`, i.e. rikipurpur-9router-*.tgz.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + pack only, do not publish to npm"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install root deps (no lockfile in repo — use install, not ci)
        run: npm install --no-audit --no-fund

      - name: Install CLI build deps
        run: npm install --prefix cli --no-audit --no-fund

      - name: Sync version from tag
        # Tags are the single source of truth — no manual package.json bump
        # needed. MUST run before the build so the module is stamped with
        # the tag version.
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER="${REF#v}"
            echo "Syncing package versions to $VER (from tag $REF)"
            VER="$VER" node -e "
              const fs = require('fs');
              for (const f of ['package.json', 'cli/package.json']) {
                const p = JSON.parse(fs.readFileSync(f, 'utf8'));
                p.version = process.env.VER;
                fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
              }
            "
          else
            echo "Not a version tag ($REF) — keeping package.json versions"
          fi

      - name: Build CLI module
        run: npm run --prefix cli build
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:20128

      - name: Pack CLI module
        # NOTE: `npm pack` ignores --prefix and packs the cwd, so run it
        # from inside cli/ — otherwise it packs the root 9router-app tree.
        working-directory: cli
        run: |
          mkdir -p /tmp/dist
          npm pack --pack-destination /tmp/dist
          ls -la /tmp/dist

      - name: Verify packed module
        run: |
          rm -rf /tmp/rel && mkdir -p /tmp/rel
          ls -la /tmp/dist
          # Guard: refuse a root-package tarball (9router-app-*) — only the
          # CLI module (rikipurpur-9router-X.Y.Z.tgz) may be published.
          if ls /tmp/dist/9router-app-*.tgz >/dev/null 2>&1; then
            echo "::error::Wrong tarball packed (root 9router-app instead of CLI module)"
            exit 1
          fi
          tar -xzf /tmp/dist/rikipurpur-9router-[0-9]*.tgz -C /tmp/rel --strip-components=1
          # Sanity: refuse to publish a broken module
          test -f /tmp/rel/cli.js
          test -f /tmp/rel/package.json
          ls /tmp/rel/app
          test -f /tmp/rel/app/custom-server.js || test -f /tmp/rel/app/server.js
          node -p "const p=require('/tmp/rel/package.json'); if(p.name!=='@rikipurpur/9router'||!p.bin?.['9router']) throw new Error('bad package'); p.version"

      - name: Publish to npm
        if: ${{ inputs.dry_run != true }}
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ls -la /tmp/dist
          npm publish /tmp/dist/rikipurpur-9router-*.tgz --provenance --access public
